    <script>
      // Applied before first paint so the stored theme doesn't flash the wrong
      // state on load. Kept tiny and inline on purpose — anything deferred is
      // already too late.
      (function () {
        try {
          var t = localStorage.getItem("lp-theme") || "auto";
          if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* private mode / storage blocked — fall through to defaults */
        }
      })();
    </script>
